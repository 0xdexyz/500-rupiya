<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#02791c" />
    <title>Hearing Sensitivity | Hearing Care &amp; Hearing Aids</title>
    <meta
      name="description"
      content="Explore personalised hearing care, hearing assessments, hearing-aid consultation, fitting and modern hearing solutions at Hearing Sensitivity."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hearing Sensitivity" />
    <meta property="og:title" content="Hearing Sensitivity | Hearing Care &amp; Hearing Aids" />
    <meta
      property="og:description"
      content="Explore personalised hearing care, hearing assessments, hearing-aid consultation, fitting and modern hearing solutions at Hearing Sensitivity."
    />
    <meta property="og:image" content="/images/phonak-infinio-charging-case.jpg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // apply the saved theme before first paint so dark mode does not flash
      try {
        if (localStorage.getItem('hs.theme') === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
      // the home page's hero photograph is the largest thing on screen, so start fetching it early
      if (location.pathname === '/') {
        var hero = document.createElement('link');
        hero.rel = 'preload';
        hero.as = 'image';
        hero.href = '/images/hero-hearing-aid-wearer.jpg';
        document.head.appendChild(hero);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
